name: PHP Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: |
          set -euo pipefail
          find . -name '*.php' -print0 | xargs -0 -n1 php -l

  coding-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install WordPress Coding Standards
        run: |
          set -euo pipefail
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs:"^3.1" --no-interaction --no-progress

      - name: Run PHPCS
        run: |
          set -euo pipefail
          export PATH="$(composer global config home)/vendor/bin:${PATH}"
          phpcs -i
          # Class files keep the plugin's existing class-tss-*.php names.
          phpcs --standard=WordPress --extensions=php \
            --exclude=WordPress.Files.FileName \
            --ignore=vendor,node_modules,.git \
            .

  functional:
    name: Plugin functionality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_CLI_ALLOW_ROOT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring
          tools: wp-cli
          coverage: none

      - name: Install WordPress and activate the plugin
        run: |
          set -euo pipefail
          {
          wp core download --path=/tmp/wordpress
          wp config create \
            --path=/tmp/wordpress \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1
          wp core install \
            --path=/tmp/wordpress \
            --url=http://localhost \
            --title="Top Social Share Tests" \
            --admin_user=admin \
            --admin_password="test-password" \
            --admin_email=admin@example.com \
            --skip-email
          ln -sfn "${GITHUB_WORKSPACE}" /tmp/wordpress/wp-content/plugins/top-social-share
          wp plugin activate top-social-share --path=/tmp/wordpress
          wp plugin status top-social-share --path=/tmp/wordpress
          } 2>&1 | tee /tmp/tss-functional-tests.log

      - name: Run functional tests
        working-directory: /tmp/wordpress
        run: |
          set -euo pipefail
          cat > /tmp/tss-functional-tests.php << 'PHP'
          <?php
          /**
           * Exercises Top Social Share against a real WordPress install.
           */

          /**
           * Developer notes for a failed check: what broke and which code to change.
           *
           * @param string $message Assertion text.
           * @return array
           */
          function tss_failure_guide( $message ) {
          	$guides = array(
          		'default options are stored on boot' => array(
          			'title'    => 'Default share settings are never saved outside wp-admin',
          			'expected' => 'After the plugin boots, tss_options is the default array: Facebook, Twitter, LinkedIn, Pinterest, and WhatsApp on, posts and pages on, small icons, and the floating placement on.',
          			'actual'   => 'get_option( \'tss_options\' ) is not an array. The option was never created, so WordPress returns false.',
          			'why'      => 'Defaults are written only from BD_TSS_Settings::bd_tss_settings_init(), which runs on admin_init. bd_tss_plugin_activate() loads that settings class only when is_admin() is true. The functionality check runs through WP-CLI, and WP-CLI does not define WP_ADMIN, so is_admin() is false. The settings class is skipped, add_option() never runs, and tss_options stays missing. The same gap affects any boot that is not an admin request, including activation from WP-CLI: the front end then reads tss_options before it exists.',
          			'fix'      => 'Seed tss_options from bd_tss_default_options() whenever the option is missing, including from register_activation_hook. Do not require is_admin() for that write. Keep admin_init for registering the settings screen.',
          			'where'    => array(
          				array(
          					'file'   => 'top-social-share.php',
          					'lines'  => '47-57',
          					'symbol' => 'bd_tss_plugin_activate()',
          					'detail' => 'Loads includes/class-tss-settings.php only inside is_admin(). Otherwise the file that saves defaults is never included.',
          				),
          				array(
          					'file'   => 'includes/class-tss-settings.php',
          					'lines'  => '40-51',
          					'symbol' => 'BD_TSS_Settings::load()',
          					'detail' => 'Reads tss_options once in the constructor and attaches bd_tss_settings_init to admin_init.',
          				),
          				array(
          					'file'   => 'includes/class-tss-settings.php',
          					'lines'  => '142-145',
          					'symbol' => 'BD_TSS_Settings::bd_tss_settings_init()',
          					'detail' => 'This is the only add_option() call for tss_options, and it runs only when the constructor saw false.',
          				),
          			),
          		),
          	);

          	if ( isset( $guides[ $message ] ) ) {
          		return $guides[ $message ];
          	}

          	return array(
          		'title'    => $message,
          		'expected' => 'This functionality check should pass.',
          		'actual'   => 'The check stopped at this assertion: ' . $message,
          		'why'      => 'The assertion in .github/workflows/php.yml did not match the plugin behavior.',
          		'fix'      => 'Search the plugin for the function named by the assertion and compare it with the expected value in the test.',
          		'where'    => array(),
          	);
          }

          /**
           * Stop the run when an expectation fails and save a report for the GitHub issue.
           *
           * @param bool   $condition Result of the expectation.
           * @param string $message   What was being checked.
           * @param array  $context   Extra facts to show in the issue.
           */
          function tss_assert( $condition, $message, $context = array() ) {
          	if ( $condition ) {
          		WP_CLI::log( 'PASS: ' . $message );
          		return;
          	}

          	$option = get_option( 'tss_options' );
          	$report = array(
          		'message'          => $message,
          		'guide'            => tss_failure_guide( $message ),
          		'context'          => $context,
          		'wordpress'        => get_bloginfo( 'version' ),
          		'is_admin'         => function_exists( 'is_admin' ) ? (bool) is_admin() : null,
          		'wp_admin'         => defined( 'WP_ADMIN' ) ? (bool) WP_ADMIN : null,
          		'settings_loaded'  => class_exists( 'BD_TSS_Settings', false ),
          		'share_loaded'     => class_exists( 'BD_TSS_Social_Share', false ),
          		'option_type'      => gettype( $option ),
          		'admin_init_count' => did_action( 'admin_init' ),
          	);
          	file_put_contents( '/tmp/tss-failure.json', wp_json_encode( $report ) );
          	WP_CLI::log(
          		sprintf(
          			'DIAG is_admin=%s settings_loaded=%s share_loaded=%s option_type=%s admin_init=%d',
          			isset( $report['is_admin'] ) && $report['is_admin'] ? 'true' : 'false',
          			$report['settings_loaded'] ? 'true' : 'false',
          			$report['share_loaded'] ? 'true' : 'false',
          			$report['option_type'],
          			(int) $report['admin_init_count']
          		)
          	);
          	WP_CLI::error( 'FAIL: ' . $message );
          }

          /**
           * Option set used by the share bar.
           *
           * @param array $extra Values that replace the defaults.
           * @return array
           */
          function tss_base_options( $extra = array() ) {
          	return array_merge(
          		array(
          			'tss_field_post_types_post'                     => '1',
          			'tss_field_post_types_page'                     => '1',
          			'tss_field_share_buttons_facebook'              => '1',
          			'tss_field_share_buttons_twitter'               => '1',
          			'tss_field_share_buttons_pinterest'             => '1',
          			'tss_field_share_buttons_linkedIn'              => '1',
          			'tss_field_share_buttons_whatsapp'              => '1',
          			'tss_field_icon_size'                           => 'small',
          			'tss_field_icon_style'                          => 'original',
          			'tss_field_icon_style_bg_color'                 => '#000000',
          			'tss_field_icon_style_foreground'               => 'original',
          			'tss_field_icon_style_foreground_color'         => '#8224e3',
          			'tss_field_icon_placement_floating_left'        => '1',
          			'tss_field_icon_placement_below_post_title'     => '1',
          			'tss_field_icon_placement_after_post_content'   => '1',
          			'tss_field_icon_placement_inside_feature_image' => '1',
          		),
          		$extra
          	);
          }

          /**
           * Replace the private settings stored on the share renderer.
           *
           * @param BD_TSS_Social_Share $share   Share renderer.
           * @param array               $options Settings to apply.
           */
          function tss_apply_options( $share, $options ) {
          	$property = new ReflectionProperty( $share, 'tss_option' );
          	$property->setAccessible( true );
          	$property->setValue( $share, $options );
          }

          require_once ABSPATH . 'wp-admin/includes/plugin.php';

          tss_assert( defined( 'BD_TSS_PLUGINS_VERSION' ) && '1.0.1' === BD_TSS_PLUGINS_VERSION, 'plugin version constant is set' );
          tss_assert( is_plugin_active( 'top-social-share/top-social-share.php' ), 'plugin is active' );
          tss_assert( function_exists( 'bd_tss_social_sharing_options' ), 'shared helpers are loaded' );

          if ( false === get_option( 'tss_options' ) ) {
          	do_action( 'admin_init' );
          }

          $defaults = get_option( 'tss_options' );
          tss_assert( is_array( $defaults ), 'default options are stored on boot' );
          tss_assert( '1' === $defaults['tss_field_share_buttons_facebook'], 'Facebook is enabled by default' );
          tss_assert( '1' === $defaults['tss_field_share_buttons_whatsapp'], 'WhatsApp is enabled by default' );
          tss_assert( '1' === $defaults['tss_field_post_types_post'], 'posts are enabled by default' );
          tss_assert( '1' === $defaults['tss_field_post_types_page'], 'pages are enabled by default' );
          tss_assert( 'small' === $defaults['tss_field_icon_size'], 'default icon size is small' );
          tss_assert( 'original' === $defaults['tss_field_icon_style'], 'default icon style is original' );
          tss_assert( '1' === $defaults['tss_field_icon_placement_floating_left'], 'floating placement is enabled by default' );

          if ( empty( $GLOBALS['admin_page_hooks']['tss'] ) ) {
          	$settings_probe = new BD_TSS_Settings();
          	$settings_probe->bd_tss_options_page();
          }
          tss_assert( isset( $GLOBALS['admin_page_hooks']['tss'] ), 'settings menu is registered' );

          $settings  = new BD_TSS_Settings();
          $sanitized = $settings->bd_tss_sanitize_options(
          	array(
          		'tss_field_post_types_post'             => '1',
          		'tss_field_share_buttons_facebook'      => 'yes',
          		'tss_field_icon_size'                   => 'huge',
          		'tss_field_icon_style'                  => 'custom',
          		'tss_field_icon_style_bg_color'         => '#abc',
          		'tss_field_icon_style_foreground'       => 'nope',
          		'tss_field_icon_style_foreground_color' => 'blue',
          		'tss_field_icon_placement_floating_left' => '1',
          		'tss_field_icon_placement_below_post_title' => '1',
          	)
          );
          tss_assert( '1' === $sanitized['tss_field_post_types_post'], 'post type checkbox is stored' );
          tss_assert( '1' === $sanitized['tss_field_share_buttons_facebook'], 'checked network is stored as on' );
          tss_assert( '0' === $sanitized['tss_field_share_buttons_twitter'], 'unchecked network is stored as off' );
          tss_assert( 'small' === $sanitized['tss_field_icon_size'], 'invalid icon size falls back to small' );
          tss_assert( 'custom' === $sanitized['tss_field_icon_style'], 'custom icon style is accepted' );
          tss_assert( 'original' === $sanitized['tss_field_icon_style_foreground'], 'invalid foreground style falls back to original' );
          tss_assert( '#abc' === $sanitized['tss_field_icon_style_bg_color'], 'hex background color is kept' );
          tss_assert( empty( $sanitized['tss_field_icon_style_foreground_color'] ), 'invalid foreground color is discarded' );
          tss_assert( '1' === $sanitized['tss_field_icon_placement_below_post_title'], 'content placement is stored' );

          $buttons = bd_tss_social_sharing_options();
          foreach ( array( 'facebook', 'twitter', 'pinterest', 'linkedIn', 'whatsapp' ) as $network ) {
          	tss_assert(
          		isset( $buttons[ $network ]['label'], $buttons[ $network ]['img'], $buttons[ $network ]['img_url'], $buttons[ $network ]['bgcolor'] )
          		&& '' !== $buttons[ $network ]['label']
          		&& '' !== $buttons[ $network ]['img'],
          		$network . ' is a share network'
          	);
          }

          add_filter(
          	'tss_social_buttons',
          	static function ( $items ) {
          		$items['example'] = array(
          			'label'   => 'Example',
          			'img'     => '<span>E</span>',
          			'img_url' => 'https://example.com/e.svg',
          			'bgcolor' => '#111111',
          		);
          		return $items;
          	}
          );
          tss_assert( isset( bd_tss_social_sharing_options()['example'] ), 'tss_social_buttons filter can add a network' );
          remove_all_filters( 'tss_social_buttons' );
          tss_assert( ! isset( bd_tss_social_sharing_options()['example'] ), 'share network filter was removed' );

          $post_id = wp_insert_post(
          	array(
          		'post_title'   => 'TSS Share Test',
          		'post_content' => 'Body',
          		'post_status'  => 'publish',
          		'post_type'    => 'post',
          	)
          );
          tss_assert( ! is_wp_error( $post_id ) && $post_id > 0, 'test post is created' );

          global $post, $wp_query;
          $post = get_post( $post_id );
          setup_postdata( $post );
          $wp_query->post              = $post;
          $wp_query->posts             = array( $post );
          $wp_query->queried_object    = $post;
          $wp_query->queried_object_id = $post_id;
          $wp_query->is_single         = true;
          $wp_query->is_singular       = true;
          $wp_query->in_the_loop       = true;

          update_option( 'tss_options', tss_base_options() );
          require_once BD_TSS_PLUGINS_PATH . 'includes/class-tss-social-share.php';
          tss_assert( isset( $instance ) && $instance instanceof BD_TSS_Social_Share, 'share renderer bootstraps' );
          $share = $instance;

          $permalink = get_permalink( $post_id );
          $title     = get_the_title( $post_id );

          $facebook = $share->bd_tss_social_share_link( 'facebook', $post_id );
          tss_assert( false !== strpos( $facebook, 'http://www.facebook.com/sharer.php?u=' . $permalink ), 'Facebook share URL uses the post permalink' );
          tss_assert( false !== strpos( $facebook, 'target="_blank"' ), 'Facebook link opens in a new tab' );

          $twitter = $share->bd_tss_social_share_link( 'twitter', $post_id );
          tss_assert( false !== strpos( $twitter, 'https://twitter.com/intent/tweet?url=' . $permalink ), 'Twitter share URL uses the post permalink' );

          $pinterest = $share->bd_tss_social_share_link( 'pinterest', $post_id );
          tss_assert( false !== strpos( $pinterest, 'https://www.pinterest.com/pin/create/button/' ), 'Pinterest share URL is built' );

          $linkedin = $share->bd_tss_social_share_link( 'linkedIn', $post_id );
          tss_assert( false !== strpos( $linkedin, 'https://www.linkedin.com/shareArticle?mini=true&url=' . $permalink ), 'LinkedIn share URL uses the post permalink' );
          tss_assert( false !== strpos( $linkedin, 'title=' . $title ), 'LinkedIn share URL includes the post title' );

          tss_assert( '' === $share->bd_tss_social_share_link( 'whatsapp', $post_id ), 'WhatsApp link is omitted on desktop' );
          tss_assert( '' === $share->bd_tss_social_share_link( 'missing', $post_id ), 'unknown networks produce no link' );

          $html = $share->bd_tss_build_share_icons();
          tss_assert( false !== strpos( $html, 'class="tss-social-div"' ), 'share bar wrapper is rendered' );
          tss_assert( false !== strpos( $html, 'data-tss-icon-name="facebook"' ), 'Facebook icon is rendered' );
          tss_assert( false !== strpos( $html, 'data-tss-icon-name="twitter"' ), 'Twitter icon is rendered' );
          tss_assert( false !== strpos( $html, 'data-tss-icon-name="pinterest"' ), 'Pinterest icon is rendered' );
          tss_assert( false !== strpos( $html, 'data-tss-icon-name="linkedIn"' ), 'LinkedIn icon is rendered' );
          tss_assert( false === strpos( $html, 'data-tss-icon-name="whatsapp"' ), 'WhatsApp icon is omitted on desktop' );
          tss_assert( false === strpos( $html, 'tss-size-2x' ) && false === strpos( $html, 'tss-size-3x' ), 'small icons have no size modifier' );

          add_filter( 'wp_is_mobile', '__return_true' );
          $whatsapp = $share->bd_tss_social_share_link( 'whatsapp', $post_id );
          tss_assert( false !== strpos( $whatsapp, 'https://api.whatsapp.com/send?text=' . $permalink ), 'WhatsApp share URL is built on mobile' );
          $mobile_html = $share->bd_tss_build_share_icons();
          tss_assert( false !== strpos( $mobile_html, 'data-tss-icon-name="whatsapp"' ), 'WhatsApp icon is rendered on mobile' );
          remove_filter( 'wp_is_mobile', '__return_true' );

          tss_apply_options(
          	$share,
          	tss_base_options(
          		array(
          			'tss_social_icon_order_0' => 'twitter',
          			'tss_social_icon_order_1' => 'facebook',
          			'tss_social_icon_order_2' => 'linkedIn',
          			'tss_social_icon_order_3' => 'pinterest',
          			'tss_social_icon_order_4' => 'whatsapp',
          		)
          	)
          );
          $ordered = $share->bd_tss_build_share_icons();
          $first   = strpos( $ordered, 'data-tss-icon-name="' );
          tss_assert( false !== $first && 0 === strpos( substr( $ordered, $first ), 'data-tss-icon-name="twitter"' ), 'icons follow the saved order' );

          tss_apply_options( $share, tss_base_options( array( 'tss_field_icon_size' => 'medium' ) ) );
          tss_assert( false !== strpos( $share->bd_tss_build_share_icons(), 'tss-size-2x' ), 'medium icons use the 2x class' );
          tss_apply_options( $share, tss_base_options( array( 'tss_field_icon_size' => 'large' ) ) );
          tss_assert( false !== strpos( $share->bd_tss_build_share_icons(), 'tss-size-3x' ), 'large icons use the 3x class' );

          $enabled = tss_base_options();
          unset( $enabled['tss_field_share_buttons_twitter'] );
          tss_apply_options( $share, $enabled );
          $enabled_html = $share->bd_tss_build_share_icons();
          tss_assert( false === strpos( $enabled_html, 'data-tss-icon-name="twitter"' ), 'disabled networks are omitted' );
          tss_assert( false !== strpos( $enabled_html, 'data-tss-icon-name="facebook"' ), 'enabled networks stay visible' );

          tss_apply_options( $share, tss_base_options() );
          $shortcode = $share->bd_tss_share_shortcode();
          tss_assert( shortcode_exists( 'top-share' ), '[top-share] shortcode is registered' );
          tss_assert( false !== strpos( $shortcode, 'tss-share-shortcode-output' ), 'shortcode wraps the share bar' );
          tss_assert( false !== strpos( $shortcode, 'sharer.php' ), 'shortcode includes a share link' );

          $wp_query->in_the_loop = false;
          tss_assert( 'UNIQUECONTENT' === $share->bd_tss_add_social_icons_placement( 'UNIQUECONTENT' ), 'icons are not injected outside the loop' );
          $wp_query->in_the_loop = true;

          $disabled_type = tss_base_options();
          unset( $disabled_type['tss_field_post_types_post'] );
          tss_apply_options( $share, $disabled_type );
          tss_assert( 'UNIQUECONTENT' === $share->bd_tss_add_social_icons_placement( 'UNIQUECONTENT' ), 'icons stay off for a disabled post type' );

          tss_apply_options( $share, tss_base_options() );
          $placed = $share->bd_tss_add_social_icons_placement( 'UNIQUECONTENT' );
          tss_assert( 2 === substr_count( $placed, 'tss-social-div' ), 'icons render before and after the content' );
          tss_assert( 0 === strpos( $placed, '<div class="tss-social-div">' ), 'icons precede the content when that placement is on' );
          tss_assert( false !== strpos( $placed, 'UNIQUECONTENT' ), 'post content is preserved' );

          $before_only = tss_base_options();
          unset( $before_only['tss_field_icon_placement_after_post_content'] );
          tss_apply_options( $share, $before_only );
          $before = $share->bd_tss_add_social_icons_placement( 'UNIQUECONTENT' );
          tss_assert( 1 === substr_count( $before, 'tss-social-div' ), 'only the selected content placement is used' );
          tss_assert( ( strlen( $before ) - strlen( 'UNIQUECONTENT' ) ) === strrpos( $before, 'UNIQUECONTENT' ), 'content placement can sit above the content only' );

          tss_assert( '<img class="featured" />' === $share->bd_tss_add_social_icons_inside_featured_image( '<img class="featured" />' ), 'featured image is unchanged without a thumbnail' );

          $bits = wp_upload_bits( 'tss-thumb.jpg', null, 'thumb' );
          tss_assert( empty( $bits['error'] ), 'test image uploads' );
          $attachment_id = wp_insert_attachment(
          	array(
          		'post_mime_type' => 'image/jpeg',
          		'post_title'     => 'TSS thumb',
          		'post_status'    => 'inherit',
          	),
          	$bits['file'],
          	$post_id
          );
          tss_assert( $attachment_id > 0, 'test image attachment is created' );
          set_post_thumbnail( $post_id, $attachment_id );
          $overlay = $share->bd_tss_add_social_icons_inside_featured_image( '<img class="featured" />' );
          tss_assert( false !== strpos( $overlay, 'tss-featured-image-overlay' ), 'icons overlay the featured image' );
          tss_assert( false !== strpos( $overlay, '<img class="featured" />' ), 'featured image markup is kept' );

          tss_apply_options( $share, tss_base_options() );
          ob_start();
          $share->bd_tss_display_social_left();
          $floating = ob_get_clean();
          tss_assert( false !== strpos( $floating, 'tss-share-floating-bar' ), 'floating bar is printed' );
          tss_assert( false !== strpos( $floating, 'sharer.php' ), 'floating bar includes a share link' );

          $no_float = tss_base_options();
          unset( $no_float['tss_field_icon_placement_floating_left'] );
          tss_apply_options( $share, $no_float );
          ob_start();
          $share->bd_tss_display_social_left();
          tss_assert( '' === ob_get_clean(), 'floating bar stays off when that placement is disabled' );

          $share->bd_tss_enqueue_script();
          tss_assert( wp_style_is( 'tss-style-handle', 'enqueued' ), 'frontend stylesheet is enqueued' );

          tss_apply_options(
          	$share,
          	tss_base_options(
          		array(
          			'tss_field_icon_style'                  => 'custom',
          			'tss_field_icon_style_bg_color'         => '#112233',
          			'tss_field_icon_style_foreground'       => 'custom',
          			'tss_field_icon_style_foreground_color' => '#445566',
          		)
          	)
          );
          $share->bd_tss_enqueue_script();
          $inline = implode( '', (array) wp_styles()->get_data( 'tss-style-handle', 'after' ) );
          tss_assert( false !== strpos( $inline, '#112233' ), 'custom icon background is printed' );
          tss_assert( false !== strpos( $inline, '#445566' ), 'custom icon foreground is printed' );

          $tags = $share->bd_tss_allow_svg_attributes( array() );
          tss_assert( isset( $tags['svg']['viewbox'], $tags['path']['d'], $tags['circle']['r'], $tags['rect']['width'] ), 'SVG markup is allowed through kses' );
          tss_assert( isset( wp_kses_allowed_html( 'post' )['svg']['xmlns'] ), 'SVG filter is attached for post content' );

          if ( ! defined( 'WP_UNINSTALL_PLUGIN' ) ) {
          	define( 'WP_UNINSTALL_PLUGIN', 'top-social-share/top-social-share.php' );
          }
          require BD_TSS_PLUGINS_PATH . 'uninstall.php';
          tss_assert( false === get_option( 'tss_options' ), 'uninstall deletes the plugin options' );

          WP_CLI::success( 'Top Social Share functional tests passed.' );
          PHP
          {
            php -l /tmp/tss-functional-tests.php
            wp eval-file /tmp/tss-functional-tests.php
          } 2>&1 | tee -a /tmp/tss-functional-tests.log

      - name: Set up Chrome for the failure screenshot
        if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Open a GitHub issue when functional tests fail
        if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          python3 .github/scripts/functional-failure-report.py \
            --workspace "${GITHUB_WORKSPACE}" \
            --report /tmp/tss-failure.json \
            --log /tmp/tss-functional-tests.log \
            --out /tmp/tss-report

          screenshot="/tmp/tss-report/failure.png"
          chrome="${CHROME_PATH:-}"
          if [ -z "${chrome}" ]; then
            chrome="$(command -v google-chrome || command -v chrome || true)"
          fi
          if [ -n "${chrome}" ]; then
            "${chrome}" --headless --disable-gpu --no-sandbox --hide-scrollbars \
              --window-size=1280,1680 \
              --screenshot="${screenshot}" \
              "file:///tmp/tss-report/failure.html" || true
          fi

          image_url=""
          if [ -f "${screenshot}" ]; then
            image_url="$(python3 .github/scripts/functional-failure-report.py --upload-screenshot "${screenshot}" || true)"
          fi

          python3 .github/scripts/functional-failure-report.py \
            --workspace "${GITHUB_WORKSPACE}" \
            --report /tmp/tss-failure.json \
            --log /tmp/tss-functional-tests.log \
            --out /tmp/tss-report \
            --image-url "${image_url}"

          gh label create functional-test \
            --color B60205 \
            --description "Automated plugin functionality check failed" \
            --force

          title="$(cat /tmp/tss-report/title.txt)"
          existing="$(gh issue list --state open --label functional-test --limit 1 --json number --jq '.[0].number // empty' || true)"
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --title "${title}" --body-file /tmp/tss-report/issue.md
            echo "Updated issue #${existing}"
          else
            url="$(gh issue create --title "${title}" --label functional-test --body-file /tmp/tss-report/issue.md)"
            echo "Created ${url}"
          fi

      - name: Close the functional-test issue when tests pass
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --label functional-test --limit 1 --json number --jq '.[0].number // empty' || true)"
          if [ -z "${existing}" ]; then
            echo "No open functional-test issue."
            exit 0
          fi
          gh issue comment "${existing}" --body "Functional tests passed on \`${REF_NAME}\` (\`${COMMIT}\`). ${RUN_URL}"
          gh issue close "${existing}" --reason completed
          echo "Closed issue #${existing}"

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_CLI_ALLOW_ROOT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring
          tools: wp-cli
          coverage: none

      - name: Install WordPress and activate the plugin
        run: |
          set -euo pipefail
          wp core download --path=/tmp/wordpress
          wp config create \
            --path=/tmp/wordpress \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_DISPLAY true --raw --path=/tmp/wordpress
          wp config set WP_DISABLE_FATAL_ERROR_HANDLER true --raw --path=/tmp/wordpress
          wp core install \
            --path=/tmp/wordpress \
            --url=http://127.0.0.1:8080 \
            --title="Top Social Share Tests" \
            --admin_user=admin \
            --admin_password="test-password" \
            --admin_email=admin@example.com \
            --skip-email
          ln -sfn "${GITHUB_WORKSPACE}" /tmp/wordpress/wp-content/plugins/top-social-share
          wp plugin activate top-social-share --path=/tmp/wordpress

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Open the public post in Chrome
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          php -d display_errors=1 -S 127.0.0.1:8080 -t /tmp/wordpress >/tmp/tss-php-server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          chrome="${CHROME_PATH:-}"
          if [ -z "${chrome}" ]; then
            chrome="$(command -v google-chrome || command -v chrome || true)"
          fi
          if [ -z "${chrome}" ]; then
            mkdir -p /tmp/tss-frontend
            echo "Chrome is not available, so the public post could not be opened." | tee /tmp/tss-frontend/check.log
            exit 1
          fi
          python3 .github/scripts/frontend-check.py --wp /tmp/wordpress --chrome "${chrome}"

      - name: Open a GitHub issue when the front end fails
        if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          primary_url=""
          extra_images=""
          if [ -f /tmp/tss-frontend/screenshots.tsv ]; then
            while IFS=$'\t' read -r stem path; do
              [ -n "${stem}" ] || continue
              [ -f "${path}" ] || continue
              url="$(python3 .github/scripts/functional-failure-report.py --upload-screenshot "${path}" --upload-name "${GITHUB_RUN_ID}-frontend-${stem}" || true)"
              if [ -z "${primary_url}" ]; then
                primary_url="${url}"
              elif [ -n "${url}" ]; then
                extra_images="${extra_images}

          ### ${stem} screenshot

          ![Front end ${stem}](${url})
          "
              fi
            done < /tmp/tss-frontend/screenshots.tsv
          fi

          python3 .github/scripts/functional-failure-report.py \
            --workspace "${GITHUB_WORKSPACE}" \
            --report /tmp/tss-frontend/result.json \
            --log /tmp/tss-frontend/check.log \
            --out /tmp/tss-frontend-issue \
            --image-url "${primary_url}"
          if [ -n "${extra_images}" ]; then
            printf '%s\n' "${extra_images}" >> /tmp/tss-frontend-issue/issue.md
          fi

          gh label create frontend-test \
            --color B60205 \
            --description "Front-end share bar check failed" \
            --force
          title="$(cat /tmp/tss-frontend-issue/title.txt)"
          existing="$(gh issue list --state open --label frontend-test --limit 1 --json number --jq '.[0].number // empty' || true)"
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --title "${title}" --body-file /tmp/tss-frontend-issue/issue.md
            echo "Updated issue #${existing}"
          else
            url="$(gh issue create --title "${title}" --label frontend-test --body-file /tmp/tss-frontend-issue/issue.md)"
            echo "Created ${url}"
          fi

      - name: Close the front-end issue when the public post renders
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --label frontend-test --limit 1 --json number --jq '.[0].number // empty' || true)"
          if [ -z "${existing}" ]; then
            echo "No open front-end issue."
            exit 0
          fi
          gh issue comment "${existing}" --body "The public post rendered the share bar on \`${REF_NAME}\` (\`${COMMIT}\`). ${RUN_URL}"
          gh issue close "${existing}" --reason completed
          echo "Closed issue #${existing}"
